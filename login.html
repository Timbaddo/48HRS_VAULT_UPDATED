</div><span class="eyebrow">WELCOME BACK</span><h1>Login to your vault.</h1><p class="muted">Manage your account, VIP access, referrals and notifications.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="btn full" type="submit">Login</button></form><p id="message" class="form-message"></p><p class="switch">New here? <a href="/signup.html">Create an account</a></p></section></main><script type="module">import{login}from'/frontend/js/auth.js';const form=document.getElementById('loginForm'),msg=document.getElementById('message'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';const r=await login(emailInput.value.trim(),passwordInput.value);if(!r.success){msg.textContent=r.message;return;}await fetch('/api/auth/login',{method:'PATCH',headers:{Authorization:`Bearer ${await r.user.getIdToken(true)}`}});location.href='/dashboard.html';});</script></body></html>
